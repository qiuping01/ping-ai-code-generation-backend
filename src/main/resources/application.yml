spring:
  application:
    name: ping-ai-code-generation-backend
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ping_ai_code_generation
    username: root
    password: 123456
  # redis
  data:
    redis:
      host: localhost
      port: 6379
      password:
      ttl: 3600
      database: 2
  profiles:
    active: local
server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.ping.pingaicodegeneration.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
# langchain4j
# 注意：api-key 等敏感信息放在 application-local.yml（已 gitignore），本地开发需自行创建
langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com
      model-name: deepseek-flash
      log-requests: true
      log-responses: true
      # 结构化输出
      max-tokens: 8192
#      strict-json-schema: true
#      response-format: json_object
      max-retries: 1
    streaming-chat-model:
      base-url: https://api.deepseek.com
      model-name: deepseek-v4-pro
      max-tokens: 65536
      log-requests: true
      log-responses: true
#      reasoning-effort: none      # 关闭思考模式

# Mermaid 架构图生成（依赖全局安装的 mmdc）
mermaid:
  puppeteer:
    # mmdc 底层 Puppeteer 使用的浏览器路径，留空则使用 Puppeteer 缓存中下载的 Chrome
    # 机器相关的路径建议写在 application-local.yml 中覆盖，例如：
    # executable-path: "C:/Program Files/Google/Chrome/Application/chrome.exe"
    executable-path:


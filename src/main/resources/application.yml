spring:
  application:
    name: ping-ai-code-generation-backend
# mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ping_ai_code_generation
    username: root
    password: 123456
  profiles:
    active: local
server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.ping.pingaicodegeneration.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
# langchain4j
# 注意：api-key 等敏感信息放在 application-local.yml（已 gitignore），本地开发需自行创建
langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com
      model-name: deepseek-flash
      log-requests: true
      log-responses: true
      # 结构化输出
      max-tokens: 8192
      strict-json-schema: true
      response-format: json_object
      max-retries: 1
    streaming-chat-model:
      base-url: https://api.deepseek.com
      model-name: deepseek-v4-pro
      max-tokens: 8192
      log-requests: true
      log-responses: true


